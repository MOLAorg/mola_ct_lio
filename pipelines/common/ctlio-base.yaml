# -----------------------------------------------------------------------------
# Continuous-time LiDAR-inertial odometry: the shared knob set.
#
# NOT a runnable pipeline on its own. The per-dataset files in the parent
# directory pull it in with mola_yaml's `$import` and rebind the handful of
# knobs that genuinely differ through a sibling `$define` block.
#
# Every entry here is an env-gated hook: the priority the parser applies is
# `environment > $define > the inline |default` below, so a variable exported
# on the command line still wins over whatever a dataset file chose. That is
# what makes a sweep over any of these a matter of exporting one variable,
# regardless of which pipeline is being run.
#
# Every knob is listed with its sweep range in the repository's agents.md.
# The defaults below are the ones the two inertial datasets share; where a
# default here differs from the C++ one, it is because the measured value is
# better, and the note next to it says so.
# -----------------------------------------------------------------------------

lidar_sensor_label: "${CTLIO_LIDAR_LABEL|lidar}"
imu_sensor_label: "${CTLIO_IMU_LABEL|imu}"
odometry_sensor_label: "${CTLIO_ODO_LABEL|odometry}"

# Whether the provider has ALREADY motion compensated each cloud onto a single
# instant. Such a cloud usually keeps its per-point time field, so the times
# look perfectly usable while the geometry is already corrected, and placing
# each point at its own pose would apply the correction a second time.
clouds_already_deskewed: ${CTLIO_ALREADY_DESKEWED|false}

# T_base_lidar. Points are moved into the body frame on arrival, because that
# is the frame the inertial factors live in, so the reported trajectory is
# `map -> base_link` directly.
#
# Getting this wrong costs almost nothing in APE and everything in RPE, so
# check RPE when changing it.
baselink2lidar_pose_str: "${CTLIO_BASELINK2LIDAR|0 0 0 0 0 0}"

# Only used if a sweep arrives with no usable per-point time field. The module
# logs which timing path it actually took, at INFO, on the first scan.
fallback_scan_period: ${CTLIO_FALLBACK_PERIOD|0.1}

# --- trajectory ---
# 40 ms knots against a 100 ms sweep means 2.5 segments per scan, which is what
# makes this continuous-time rather than scan-to-map. A dataset whose clouds
# arrive already deskewed has to raise this to the scan period instead, so that
# each scan constrains exactly one knot.
# Phase offset stays at zero. Moving it to half a segment was tried on the
# reasoning that it centers an undivided scan between its two knots; measured,
# it costs snow-2 a factor of seven (0.021 m against 0.131 m) and helps
# nothing. See agents.md.
segment_interval: ${CTLIO_SEG_INTERVAL|0.04}
knot_count: ${CTLIO_KNOT_COUNT|4}
segment_phase_offset: ${CTLIO_SEG_PHASE|0.0}

# --- solver ---
max_iterations: ${CTLIO_MAX_ITERS|25}
rematch_every: ${CTLIO_REMATCH_EVERY|2}
convergence_threshold: ${CTLIO_CONVERGE_TH|0.001}
lambda: ${CTLIO_LAMBDA|0.0}
relinearize_each_slide: ${CTLIO_RELIN|false}
max_step_translation: ${CTLIO_MAX_STEP|1.0}
max_step_velocity: ${CTLIO_MAX_STEP_V|2.0}
lidar_balance: ${CTLIO_LIDAR_BALANCE|TwoSided}
lidar_balance_max_scale: ${CTLIO_LIDAR_BALANCE_MAX|1000.0}
lidar_balance_min_dof: ${CTLIO_BALANCE_MIN_DOF|200}
lidar_balance_smoothing: ${CTLIO_BALANCE_SMOOTH|0.0}
# Bounds how far one window's residuals may pull the balance down, as a
# multiple of the running median. One-sided on purpose, see WindowOptimizer.h.
lidar_balance_outlier_ratio: ${CTLIO_BALANCE_OUTLIER|3.0}
lidar_balance_baseline_windows: ${CTLIO_BALANCE_BASELINE|100}
# Ceiling on the balance, in proportion to how evenly the geometry constrains
# translation. A degenerate view fits well and so asks for the most weight,
# which is exactly when it should get least. See WindowOptimizer.h.
lidar_balance_conditioning_reference: ${CTLIO_BALANCE_COND|0.10}
starvation_ratio: ${CTLIO_STARVATION|0.0}
# A segment whose points carry their own capture times is ready to close a
# whole sweep before the inertial samples spanning it arrive. Waiting costs
# nothing; building the factor from partial coverage gives a wrong
# measurement rather than a weak one. See agents.md.
max_imu_wait_segments: ${CTLIO_IMU_WAIT|3.0}
min_imu_coverage: ${CTLIO_IMU_COVERAGE|0.98}
velocity_prior_sigma: ${CTLIO_VEL_PRIOR|5.0}
bias_prior_sigma_acc: ${CTLIO_BIAS_PRIOR_ACC|0.3}
bias_prior_sigma_gyro: ${CTLIO_BIAS_PRIOR_GYRO|0.02}
kernel: ${CTLIO_KERNEL|Cauchy}
kernel_scale: ${CTLIO_KERNEL_SCALE|0.5}

# --- inertial ---
use_imu: ${CTLIO_USE_IMU|true}
# Temporal calibration between the LiDAR and IMU clocks. A continuous-time
# estimator is unusually exposed to this: with real per-point times both
# sensors constrain the same motion, so an offset is a direct conflict
# rather than a bias. See agents.md.
imu_time_offset: ${CTLIO_IMU_DT|0.0}
gyro_noise_density: ${CTLIO_GYRO_SIGMA|1.7e-4}
# The accelerometer weight is an EFFECTIVE one, not the datasheet figure.
# At the sensor's nominal 2e-3 the inertial factors carry some four orders of
# magnitude more information than the whole LiDAR block, so the trajectory
# follows the integrated IMU and the geometry cannot correct it. Measured on
# observatory-quarter-01, APE against ground truth: 2e-3 -> 0.737 m,
# 1e-2 -> 6.285 m, 5e-2 -> 0.039 m, 2e-1 -> 0.041 m. It is flat from 5e-2 on,
# and 1e-2 is not a smooth interpolation between the two ends but a blow-up,
# so do not read this axis as monotonic. See agents.md.
accel_noise_density: ${CTLIO_ACCEL_SIGMA|5.0e-2}
bias_sigma_acc: ${CTLIO_BIAS_SIGMA_ACC|1e-3}
bias_sigma_gyro: ${CTLIO_BIAS_SIGMA_GYRO|1e-4}
# External odometry: OFF. The factor works and is worth 5% on arc-2 and 8% on
# arc-3, but fusing a second pose source while the LiDAR-inertial core still
# has unexplained failures only makes those harder to read. It stays available
# and disabled until the core is understood on its own.
odometry_sigma_lin: ${CTLIO_ODO_SIGMA_LIN|0.0}
odometry_sigma_ang: ${CTLIO_ODO_SIGMA_ANG|0.0}
# Only used when use_imu is false, where it stands in for the inertial factors.
twist_continuity_weight: ${CTLIO_TWIST_W|2.0}

# --- points ---
# min_range exists to reject the carrier itself: a dense near-field cluster
# that moves with the sensor acts as a false zero-motion constraint. A rig
# that puts nothing in its own near field can lower it.
min_range: ${CTLIO_MIN_RANGE|1.0}
max_range: ${CTLIO_MAX_RANGE|100.0}
source_voxel_size: ${CTLIO_DS_SIZE|0.4}
source_voxel_stride: ${CTLIO_DS_STRIDE|1}
# A floor on the points a segment must carry before it is re-decimated on a
# finer cell. Off by default: it earns its keep only where scans are sparse
# enough that the floor stays below what healthy data delivers, so it is set
# per dataset. See the note in each pipeline.
min_segment_points: ${CTLIO_MIN_SEG_PTS|0}
map_voxel_size: ${CTLIO_VOXEL_SIZE|0.4}

# --- map ---
map_radius: ${CTLIO_MAP_RADIUS|120.0}
map_prune_period: ${CTLIO_PRUNE_PERIOD|25}
# Background rebuild of the map's search tree. Off keeps two runs over the same
# bag bit-for-bit identical, which a result that has to be defended needs. On is
# worth measuring: profiled, map insertion is two thirds of the wall clock and
# the rebuild inside it runs in the calling thread. See CtMapMatcher.h.
map_async_rebuild: ${CTLIO_MAP_ASYNC|false}
k_correspondences_for_cov: ${CTLIO_K_COV|20}
min_correspondences_for_cov: ${CTLIO_MIN_K_COV|5}
max_distance_for_cov: ${CTLIO_MAX_DIST_COV|1.0}
max_plane_deviation_for_cov: ${CTLIO_PLANE_DEV_COV|0.0}

# --- matcher ---
match_threshold: ${CTLIO_MATCH_TH|0.8}
# An adaptive gate: tight in steady state, opened while the correspondence
# count is collapsing against its own recent median, relaxed once it recovers.
# Zero leaves the gate fixed. See CtOdometryEngine.h for why the count and not
# the residual is the signal.
gate_open_inlier_ratio: ${CTLIO_GATE_RATIO|0.0}
gate_max_threshold: ${CTLIO_GATE_MAX|1.0}
gate_open_step: ${CTLIO_GATE_OPEN|1.5}
gate_close_step: ${CTLIO_GATE_CLOSE|0.9}
gate_baseline_windows: ${CTLIO_GATE_BASELINE|100}
# Solve a collapsed window again with the gate already opened, rather than
# letting the widening help only its successor. See CtOdometryEngine.h.
gate_retries_per_window: ${CTLIO_GATE_RETRIES|0}
# Size the gate to the motion instead of fixing it: the prediction error a
# gate has to accommodate grows with how far the platform moved in a segment.
# Zero keeps the fixed gate. See CtOdometryEngine.h.
gate_speed_scale: ${CTLIO_GATE_SPEED|0.0}
gate_min_threshold: ${CTLIO_GATE_MIN|0.1}
# The speed the gate is sized from rises at once and falls only by this factor
# per window, so the gate does not narrow the moment the platform slows.
gate_speed_decay: ${CTLIO_GATE_DECAY|0.995}
match_threshold_far: ${CTLIO_MATCH_TH_FAR|0.0}
match_knee_range: ${CTLIO_MATCH_KNEE|15.0}
match_transition_width: ${CTLIO_MATCH_WIDTH|5.0}

# --- output ---
# Per-stage timings, printed as the standard MRPT profiler table at the end of
# the run. On by default, as in the other MOLA front ends: the breakdown is
# what says whether the cost is matching, assembly or solve, and it is the
# first thing wanted whenever a run is slower than expected.
profiler_enabled: ${CTLIO_PROFILE|true}
map_publish_period: ${CTLIO_MAP_PUBLISH_PERIOD|0.5}
