# -----------------------------------------------------------------------------
# Continuous-time LiDAR-inertial odometry, Oxford Spires.
#
# Handheld/backpack rig, Hesai QT64 at ~10 Hz with a real per-point time field,
# plus an IMU. This is the reference configuration: it sits on the shared base
# unchanged apart from the extrinsic, so anything it needs to say is said in
# `common/ctlio-base.yaml`.
#
# The `$define` block below rebinds the base's `${VAR|default}` hooks in place;
# an env var of the same name still overrides it. Every knob, with its sweep
# range, is in the repository's agents.md.
# -----------------------------------------------------------------------------

$define:
  # T_base_lidar, from the dataset's sensor.yaml: the raw LiDAR frame yawed
  # 180 deg and lifted 0.124 m.
  CTLIO_BASELINK2LIDAR: "0 0 0.124 180 0 0"

  # The segment floor stays off here. It exists for grand-tour's confined
  # missions, which hold a few hundred occupied cells per scan; Oxford's
  # segments sit near three thousand, so any floor worth having there fires on
  # healthy data. Measured on all three sequences it costs 6% to 13%.
  CTLIO_MIN_SEG_PTS: 0

  # Spacing map insertions by travel stays off here. It is a large win on the
  # legged corpus, but this rig's segments carry 1560 points against that
  # corpus's 5000 to 6400, over a fifth of the interval, so the same bar leaves
  # a third of the map density behind: 16k points per metre against 52k. It
  # runs four times faster with it and scores worse, 0.0571 to 0.0661 on the
  # sequence that suffers most, and tightening the bar to 3 cm recovers only
  # part of that. Enable it here only when throughput matters more than
  # accuracy.
  CTLIO_MAP_MIN_T: 0.0
  CTLIO_MAP_MIN_R: 0.0
  CTLIO_MATCH_TH: 0.2

$import: common/ctlio-base.yaml
