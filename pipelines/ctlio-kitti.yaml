# -----------------------------------------------------------------------------
# Continuous-time LiDAR-inertial odometry, KITTI odometry benchmark.
#
# Two things make KITTI a degraded case for this method, and both are
# properties of the dataset rather than choices:
#
# - The clouds carry **no per-point timestamps at all**, so the continuous-time
#   part falls back to synthesizing times from each point's azimuth. Every
#   KITTI number from this method is therefore an azimuth-timing number.
# - The MOLA KITTI source exposes no IMU stream, so this runs LiDAR-only and
#   the twist-continuity term stands in for the inertial factors.
#
# Every knob here is listed with its sweep range in the repository's agents.md.
# -----------------------------------------------------------------------------

lidar_sensor_label: "lidar"
imu_sensor_label: "imu"

# KITTI ground truth is given in the LiDAR frame, so no extrinsic is applied.
baselink2lidar_pose_str: "${CTLIO_BASELINK2LIDAR|0 0 0 0 0 0}"

# Only used if a sweep arrives with no usable per-point time field. This
# dataset's does carry one; the module logs which path it took on the first
# scan, at INFO.
fallback_scan_period: ${CTLIO_FALLBACK_PERIOD|0.1}

# --- trajectory ---
# 40 ms knots against a 100 ms sweep means 2.5 segments per scan, which is what
# makes this continuous-time rather than scan-to-map.
segment_interval: ${CTLIO_SEG_INTERVAL|0.04}
knot_count: ${CTLIO_KNOT_COUNT|4}

# --- solver ---
max_iterations: ${CTLIO_MAX_ITERS|25}
rematch_every: ${CTLIO_REMATCH_EVERY|2}
convergence_threshold: ${CTLIO_CONVERGE_TH|0.001}
lambda: ${CTLIO_LAMBDA|0.0}
kernel: ${CTLIO_KERNEL|Cauchy}
kernel_scale: ${CTLIO_KERNEL_SCALE|0.5}

# --- inertial ---
use_imu: ${CTLIO_USE_IMU|false}
gyro_noise_density: ${CTLIO_GYRO_SIGMA|1.7e-4}
# The accelerometer weight is an EFFECTIVE one, not the datasheet figure.
# At the sensor's nominal 2e-3 the inertial factors carry some four orders of
# magnitude more information than the whole LiDAR block, so the trajectory
# follows the integrated IMU and the geometry cannot correct it. Measured on
# observatory-quarter-01, APE against ground truth: 2e-3 -> 0.737 m,
# 1e-2 -> 6.285 m, 5e-2 -> 0.039 m, 2e-1 -> 0.041 m. It is flat from 5e-2 on,
# and 1e-2 is not a smooth interpolation between the two ends but a blow-up,
# so do not read this axis as monotonic. See agents.md.
accel_noise_density: ${CTLIO_ACCEL_SIGMA|5.0e-2}
bias_sigma_acc: ${CTLIO_BIAS_SIGMA_ACC|1e-3}
bias_sigma_gyro: ${CTLIO_BIAS_SIGMA_GYRO|1e-4}
# Only used when use_imu is false, where it stands in for the inertial factors.
twist_continuity_weight: ${CTLIO_TWIST_W|2.0}

# --- points ---
# A vehicle roof mount has no near-field carrier to reject.
min_range: ${CTLIO_MIN_RANGE|0.3}
max_range: ${CTLIO_MAX_RANGE|120.0}
source_voxel_size: ${CTLIO_DS_SIZE|0.4}
map_voxel_size: ${CTLIO_VOXEL_SIZE|0.4}

# --- map ---
map_radius: ${CTLIO_MAP_RADIUS|120.0}
map_prune_period: ${CTLIO_PRUNE_PERIOD|25}
k_correspondences_for_cov: ${CTLIO_K_COV|20}
min_correspondences_for_cov: ${CTLIO_MIN_K_COV|5}
max_distance_for_cov: ${CTLIO_MAX_DIST_COV|1.0}
max_plane_deviation_for_cov: ${CTLIO_PLANE_DEV_COV|0.0}

# --- matcher ---
match_threshold: ${CTLIO_MATCH_TH|0.4}
match_threshold_far: ${CTLIO_MATCH_TH_FAR|0.0}
match_knee_range: ${CTLIO_MATCH_KNEE|15.0}
match_transition_width: ${CTLIO_MATCH_WIDTH|5.0}

# --- output ---
# Per-stage timings, printed at the end of the run. Off by default: the
# breakdown is what says whether the cost is matching, assembly or solve.
profiler_enabled: ${CTLIO_PROFILE|false}
map_publish_period: 0.5
