# -----------------------------------------------------------------------------
# Continuous-time LiDAR-inertial odometry, KITTI odometry benchmark.
#
# Two things make KITTI a degraded case for this method, and both are
# properties of the dataset rather than choices:
#
# - The clouds carry **no per-point timestamps at all**, so the continuous-time
#   part falls back to synthesizing times from each point's azimuth. Every
#   KITTI number from this method is therefore an azimuth-timing number.
# - The MOLA KITTI source exposes no IMU stream, so this runs LiDAR-only and
#   the twist-continuity term stands in for the inertial factors. The base's
#   inertial knobs are still imported; they are simply not reached.
#
# KITTI ground truth is given in the LiDAR frame, so the base's identity
# extrinsic is the right one.
#
# The `$define` block below rebinds the base's `${VAR|default}` hooks in place;
# an env var of the same name still overrides it. Every knob, with its sweep
# range, is in the repository's agents.md.
# -----------------------------------------------------------------------------

$define:
  CTLIO_USE_IMU: false

  # A vehicle roof mount has no near-field carrier to reject, and the open
  # road returns usefully further out than a handheld rig indoors.
  CTLIO_MIN_RANGE: 0.3
  CTLIO_MAX_RANGE: 120.0

  # Left where KITTI has always run it. The pipeline never named this knob, so
  # it took the code's own default rather than the base's "off"; it is written
  # out here so the value is visible instead of inherited, and so that a change
  # to either default does not move KITTI's numbers on its own.
  CTLIO_MIN_SEG_PTS: 2500

$import: common/ctlio-base.yaml
