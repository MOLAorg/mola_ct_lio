# -----------------------------------------------------------------------------
# Continuous-time LiDAR-inertial odometry, GrandTour.
#
# Legged robot, Hesai at 10 Hz with a per-point time field, plus an IMU.
#
# The rig's base frame is called `base`, not `base_link`, so the bag readers
# need MOLA_TF_BASE_LINK=base or no scan will resolve a pose at all. The bag
# also carries /tf, so the LiDAR extrinsic is resolved there and the base's
# identity default is the right one.
#
# The `$define` block below rebinds the base's `${VAR|default}` hooks in place;
# an env var of the same name still overrides it. Every knob, with its sweep
# range, is in the repository's agents.md.
# -----------------------------------------------------------------------------

$define:
  # IMPORTANT: the only Hesai topic these bags carry is
  # `/boxi/hesai/points_undistorted`, i.e. the provider has ALREADY motion
  # compensated the cloud onto a single instant. It nonetheless keeps its
  # per-point time field, so the times look perfectly usable while the geometry
  # is already corrected, and placing each point at its own pose would apply
  # the correction a second time.
  #
  # So the scans are read as single-instant observations, and the knot spacing
  # is set to the scan period rather than a fraction of it: each scan then
  # constrains exactly one knot. This costs the method its continuous-time
  # advantage on this dataset, but it is the only correct reading of the data.
  # A raw, distorted Hesai bag would restore it; none is published here.
  CTLIO_ALREADY_DESKEWED: true
  CTLIO_SEG_INTERVAL: 0.1

  # Higher than the Oxford pipeline's, and deliberately so. This dataset's
  # confined missions hold a few hundred occupied cells per scan where Oxford
  # holds thousands, so the floor has to sit above what Oxford normally
  # delivers to do anything here. It is worth 2.4x on arc-2 and 1.5x on arc-3,
  # and costs Oxford a factor of two, which is why it is set per dataset.
  CTLIO_MIN_SEG_PTS: 5000

  # Spacing map insertions by travel, and the tight acceptance distance it
  # makes possible. Insertion is otherwise driven by the segment rate, so a
  # mission that slows to 0.16 m/s writes the same ground four times more
  # densely than its own median, and the neighborhood the GICP covariances are
  # fitted to ends up describing the pose error of those windows rather than
  # the surface. The mission worst affected goes from 0.275 to 0.096 once the
  # spacing is in force, and it no longer needs the wide acceptance distance it
  # appeared to demand; the rest of the corpus moves by millimeters. Time in
  # map insertion falls by an order of magnitude with it.
  #
  # Both are set per dataset. Oxford's segments carry a third as many points
  # over a fifth of the interval, so the same spacing leaves it far too sparse
  # a map and costs it accuracy there. See agents.md.
  CTLIO_MAP_MIN_T: 0.10
  CTLIO_MAP_MIN_R: 5
  CTLIO_MATCH_TH: 0.2

  # Finer than the base default, which the spacing above pays for: fewer
  # insertions leave room to put more points into each one that is kept. Worth
  # 16% on the mission the spacing costs the most, and neutral elsewhere. At
  # 0.20 one mission moves by as much as its entire error, so this is as fine
  # as the corpus supports.
  CTLIO_VOXEL_SIZE: 0.3

$import: common/ctlio-base.yaml
